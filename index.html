<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamHub</title>
    <style>
        /* Force clean full-viewport styling */
        html, body {
            margin: 0 !important;
            padding: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            overflow: hidden !important;
            background-color: #000000;
        }
        
        /* Direct frame overlay configuration */
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            margin: 0;
            padding: 0;
            z-index: 9999;
        }
    </style>
</head>
<body>

    <!-- 
      Embedded media wrapper targeting Rick and Morty (IMDb ID: tt2861424)
      Includes auto-play framework and full hardware canvas privileges.
    -->
    <iframe 
        src="https://vidsrc.net" 
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen" 
        allowfullscreen>
    </iframe>

</body>
</html>
