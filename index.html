<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Tab</title>
    <style>
        :root {
            --bg-color: #0c0c0e;
            --accent-color: #e50914;
            --text-color: #ffffff;
            --panel-bg: rgba(20, 20, 23, 0.95);
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--text-color);
        }

        /* Nav Header Layout */
        .top-navbar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: var(--panel-bg);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            box-sizing: border-box;
            z-index: 999999;
            border-bottom: 1px solid #1f1f23;
        }

        .logo {
            font-weight: 800;
            font-size: 1.3rem;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Search Section */
        .search-box-container {
            position: relative;
            width: 350px;
        }

        .search-box-container input {
            width: 100%;
            padding: 10px 15px;
            background: #1c1c21;
            border: 1px solid #333;
            color: #fff;
            border-radius: 20px;
            outline: none;
            box-sizing: border-box;
        }

        /* Live dropdown results window */
        .results-dropdown {
            position: absolute;
            top: 45px;
            left: 0;
            width: 100%;
            background: #141417;
            border: 1px solid #333;
            border-radius: 8px;
            max-height: 350px;
            overflow-y: auto;
            display: none;
            box-shadow: 0 10px 25px rgba(0,0,0,0.7);
        }

        .result-item {
            display: flex;
            align-items: center;
            padding: 10px;
            cursor: pointer;
            border-bottom: 1px solid #222;
        }

        .result-item:hover {
            background: #1c1c21;
        }

        .result-item img {
            width: 40px;
            height: 60px;
            object-fit: cover;
            border-radius: 4px;
            margin-right: 15px;
        }

        /* Main Player Container */
        .player-viewport {
            position: absolute;
            top: 60px;
            left: 0;
            width: 100%;
            height: calc(100% - 60px);
            background: #000;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        .placeholder-message {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #888;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="top-navbar">
        <div class="logo">StreamHub</div>
        
        <div class="search-box-container">
            <input type="text" id="searchInput" placeholder="Search Movie or TV Show Title..." oninput="searchMedia()">
            <div id="dropdown" class="results-dropdown"></div>
        </div>
        <div style="width: 100px;"></div> <!-- Spacer -->
    </div>

    <div class="player-viewport">
        <div id="placeholder" class="placeholder-message">
            <h2>Ready to Watch</h2>
            <p>Type a movie or show name in the search bar above and click or hit Enter to play.</p>
        </div>
        <iframe id="mainStreamPlayer" style="display: none;" allow="autoplay; fullscreen; encrypted-media" allowfullscreen></iframe>
    </div>

    <script>
        let activeMedia = { id: "", type: "movie" };
        let topResult = null;

        async function searchMedia() {
            const query = document.getElementById('searchInput').value;
            const dropdown = document.getElementById('dropdown');
            
            if (query.length < 2) {
                dropdown.style.display = 'none';
                topResult = null;
                return;
            }

            try {
                // Using an unauthenticated community mirror endpoint for seamless lookup
                const res = await fetch(`https://vidsrc.xyz{encodeURIComponent(query)}`);
                const data = await res.json();
                
                dropdown.innerHTML = "";
                
                if (data && data.length > 0) {
                    dropdown.style.display = 'block';
                    topResult = data[0]; // Set the default item for the Enter key

                    data.forEach(item => {
                        const title = item.title || item.name || "Unknown Title";
                        // Auto-detect type based on structural properties
                        const mediaType = item.type === 'tv' || item.season || item.episode ? 'tv' : 'movie';
                        const year = item.year || 'N/A';
                        
                        const div = document.createElement('div');
                        div.className = 'result-item';
                        // Clean, minimal placeholder structure to avoid image load breakdowns
                        div.innerHTML = `<div style="width:40px; height:60px; background:#222; margin-right:15px; border-radius:4px; display:flex; align-items:center; justify-content:center; font-size:10px; color:#555;">🎬</div><div><strong>${title}</strong><br><small>${mediaType.toUpperCase()} • ${year}</small></div>`;
                        div.onclick = () => selectMedia(item.id, mediaType);
                        dropdown.appendChild(div);
                    });
                } else {
                    dropdown.style.display = 'none';
                    topResult = null;
                }
            } catch (err) {
                console.error("Search directory error:", err);
            }
        }

        // Listen for the Enter key inside the search box
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                if (topResult) {
                    const mediaType = topResult.type === 'tv' || topResult.season || topResult.episode ? 'tv' : 'movie';
                    selectMedia(topResult.id, mediaType);
                }
            }
        });

        function selectMedia(id, type) {
            activeMedia.id = id;
            activeMedia.type = type;
            
            document.getElementById('dropdown').style.display = 'none';
            document.getElementById('searchInput').value = "";
            document.getElementById('placeholder').style.display = 'none';
            document.getElementById('mainStreamPlayer').style.display = 'block';
            
            updatePlayer();
        }

        function updatePlayer() {
            if (!activeMedia.id) return;
            const player = document.getElementById('mainStreamPlayer');
            
            // Routes dynamically using standard embedded mirrors with auto-subtitles
            if (activeMedia.type === 'movie') {
                player.src = `https://vidsrc.to{activeMedia.id}`;
            } else {
                // Defaults directly to Season 1, Episode 1. Use player controls to hop episodes.
                player.src = `https://vidsrc.to{activeMedia.id}/1/1`;
            }
        }

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.search-box-container')) {
                document.getElementById('dropdown').style.display = 'none';
            }
        });
    </script>
</body>
</html>
