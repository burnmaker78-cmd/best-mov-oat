<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamHub</title>
    <style>
        /* Force absolute full-screen canvas layout */
        html, body {
            margin: 0 !important;
            padding: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            overflow: hidden !important;
            background-color: #000000;
        }
        
        /* Make the streaming interface fill the entire screen */
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            margin: 0;
            padding: 0;
            z-index: 9999;
        }
    </style>
</head>
<body>

    <!-- 
      Using an active unblocked mirror layout.
      This includes an internal searchable movie directory, multi-server routes, 
      and clean subtitle selections natively inside the frame.
    -->
    <iframe 
        src="https://vidsrc.pm" 
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen" 
        allowfullscreen>
    </iframe>

</body>
</html>
